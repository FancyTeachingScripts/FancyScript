# Option x theme matrix for tools/gen-main.sh
# One option identifier per line, in the order they should appear
# (commented out) in the generated \RequirePackage[...] block.
# Format: <option-id>|<German description shown as a comment>
presentation-minimal|nur Inhalt ohne Features
presentation-minimal-session|nur Inhalt, Stundeneinteilung
presentation-minimal-attachments|nur Inhalt + Dateianhänge
presentation-nosession|alle Features, ohne Stundeneinteilung
presentation-noaufraeumen|alle Features außer Aufräumen
presentation-notimer|alle Features außer Timer, Stundeneinteilung
presentation-full|alle Features, Stundeneinteilung

presentation-minimal-bright|nur Inhalt ohne Features (heller Hintergrund)
presentation-minimal-session-bright|nur Inhalt, Stundeneinteilung (heller Hintergrund)
presentation-minimal-attachments-bright|nur Inhalt + Dateianhänge (heller Hintergrund)
presentation-nosession-bright|alle Features, ohne Stundeneinteilung (heller Hintergrund)
presentation-noaufraeumen-bright|alle Features außer Aufräumen (heller Hintergrund)
presentation-notimer-bright|alle Features außer Timer (heller Hintergrund)
presentation-full-bright|alle Features, Stundeneinteilung (heller Hintergrund)
print-students|QR-Codes & Dateianhang, für Schüler
print-solution|QR-Codes & Dateianhang, Muster-Lösung
print-students-cover|wie print-students + Cover-Seite mit Logo+Titel
print-solution-cover|wie print-solution + Cover-Seite mit Logo+Titel
print-students-minimal|nur Inhalt ohne Features, für Schüler
print-solution-minimal|nur Inhalt ohne Features, Muster-Lösung

# Themes: "default" produces no active \SetTheme line (commented out);
# any other name produces an active \SetTheme{<name>} line.
[themes]
default
mtg
derksen
