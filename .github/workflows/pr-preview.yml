name: PR Preview – Compile PDFs (reusable)

on:
  workflow_call:
    inputs:
      template_dir:
        description: 'Where the template payload lives: "template" for a course repo, "." for this repo itself'
        required: false
        default: 'template'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  compile-preview:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        texfile:
          - presentation_noaufraeumen.tex
          - print_students-cover.tex
          - print_solution-cover.tex
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate main/*.tex from the option matrix
        run: bash ${{ inputs.template_dir }}/tools/gen-main.sh main

      - name: Compile ${{ matrix.texfile }}
        run: |
          tectonic -Z search-path=. -Z search-path=${{ inputs.template_dir }} \
                   -Z search-path=${{ inputs.template_dir }}/sty/moloch \
                   -Z continue-on-errors -o . main/${{ matrix.texfile }}

      - name: Get base filename
        id: basename
        run: |
          basename="${{ matrix.texfile }}"
          basename="${basename%.tex}"
          echo "basename=$basename" >> $GITHUB_OUTPUT

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ steps.basename.outputs.basename }}
          path: ${{ steps.basename.outputs.basename }}.pdf
          retention-days: 7
          compression-level: 0

  comment-on-pr:
    needs: compile-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all compiled PDFs
        uses: actions/download-artifact@v4
        with:
          pattern: "preview-*"
          merge-multiple: true
          path: downloaded-pdfs

      - name: Publish PDFs to previews branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin previews; then
            git fetch origin previews
            git checkout previews
          else
            git checkout --orphan previews
            git rm -rf . || true
          fi

          PR_DIR="pr-${{ github.event.pull_request.number }}"
          SHA_SHORT="${GITHUB_SHA::7}"
          mkdir -p "$PR_DIR"

          # Drop the previous commit's PDFs and publish this commit's under a
          # SHA-suffixed name. jsDelivr caches GitHub-sourced branch content
          # for hours and its purge API is best-effort/not-instant, so a
          # fixed filename (print_students-cover.pdf) can keep serving a
          # stale build after a push. A per-commit filename is a guaranteed
          # cache miss instead of a race against purge propagation.
          rm -f "$PR_DIR"/*.pdf
          for f in downloaded-pdfs/*.pdf; do
            name="$(basename "$f" .pdf)"
            cp "$f" "$PR_DIR/${name}-${SHA_SHORT}.pdf"
          done

          git add "$PR_DIR"
          git commit -m "Update previews for PR #${{ github.event.pull_request.number }} (${SHA_SHORT})" || echo "No changes to commit"
          git push origin previews || (git pull origin previews --rebase && git push origin previews)

          # Best-effort purge so the old (now-removed) filenames don't
          # linger in jsDelivr's cache indefinitely.
          for f in "$PR_DIR"/*.pdf; do
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@previews/$f" > /dev/null || true
          done

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            const prNumber = context.issue.number;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const rows = artifacts.data.artifacts
              .filter(a => a.name.startsWith('preview-'))
              .map(a => {
                const baseName = a.name.replace('preview-', '');
                // Must match the "${name}-${SHA_SHORT}.pdf" filename the
                // publish step just pushed to the previews branch, so this
                // link is always a cache miss on jsDelivr.
                const pdfName = `${baseName}-${sha}.pdf`;
                const viewUrl = `https://cdn.jsdelivr.net/gh/${context.repo.owner}/${context.repo.repo}@previews/pr-${prNumber}/${pdfName}`;
                const downloadUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${a.id}`;
                return `| \`${baseName}.pdf\` | [👁 Open in Browser Viewer](${viewUrl}) | [⬇ Download ZIP](${downloadUrl}) |`;
              })
              .join('\n');

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '<!-- pdf-preview-bot -->',
              '### 📄 PDF Preview',
              `Compiled for commit \`${sha}\` — [View Actions run](${runUrl})`,
              '',
              '| PDF | In-Browser View | Download |',
              '|-----|-----------------|----------|',
              rows,
              '',
              `_Updated: ${new Date().toUTCString()}_`,
            ].join('\n');

            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
            });

            const existing = comments.find(c => c.body.startsWith('<!-- pdf-preview-bot -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body,
              });
            }
