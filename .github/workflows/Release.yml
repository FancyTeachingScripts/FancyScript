name: Compile Demo PDFs

# Controls when the workflow will run
on:
  # Triggers the workflow on push to any branch
  push:
  # Triggers the workflow when a release is created
  #release:
  #  types: [created]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Job to prepare the LaTeX files (convert SVG and modify LaTeX)
  prepare:
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

  # Job to compile the main LaTeX document
  compile:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Comic Sans MS font (using Comic Neue as substitute)
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-comic-neue fontconfig texlive-lang-german
          # Create symlinks so that "Comic Sans MS" is recognized by luaotfload
          sudo mkdir -p /usr/share/fonts/truetype/comic-sans-ms
          sudo ln -sf /usr/share/fonts/opentype/comic-neue/ComicNeue-Regular.otf "/usr/share/fonts/truetype/comic-sans-ms/Comic Sans MS.ttf"
          sudo ln -sf /usr/share/fonts/opentype/comic-neue/ComicNeue-Bold.otf "/usr/share/fonts/truetype/comic-sans-ms/Comic Sans MS Bold.ttf"
          sudo ln -sf /usr/share/fonts/opentype/comic-neue/ComicNeue-Italic.otf "/usr/share/fonts/truetype/comic-sans-ms/Comic Sans MS Italic.ttf"
          sudo ln -sf /usr/share/fonts/opentype/comic-neue/ComicNeue-Regular.otf "/usr/share/fonts/truetype/comic-sans-ms/ComicSansMS.ttf"
          sudo fc-cache -fv
          luaotfload-tool --update --force

      # Compile LaTeX document to PDF using XeLaTeX
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          compiler: lualatex

      # Upload compiled PDF for combination job
      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: main.pdf
          retention-days: 1
          compression-level: 0

  # Job to compile all Demo_PDFs LaTeX files in parallel
  compile-demo-pdfs:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        tex_file: 
          - presentation-full.tex
          - presentation-minimal-session.tex
          - presentation-minimal.tex
          - print-solution-cover.tex
          - print-students-cover.tex
          - print-students.tex
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Comic Sans MS font (using Comic Neue as substitute)
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-comic-neue fontconfig texlive-lang-german
          # Create symlinks so that "Comic Sans MS" is recognized by luaotfload
          sudo mkdir -p /usr/share/fonts/truetype/comic-sans-ms
          sudo ln -sf /usr/share/fonts/opentype/comic-neue/ComicNeue-Regular.otf "/usr/share/fonts/truetype/comic-sans-ms/Comic Sans MS.ttf"
          sudo ln -sf /usr/share/fonts/opentype/comic-neue/ComicNeue-Bold.otf "/usr/share/fonts/truetype/comic-sans-ms/Comic Sans MS Bold.ttf"
          sudo ln -sf /usr/share/fonts/opentype/comic-neue/ComicNeue-Italic.otf "/usr/share/fonts/truetype/comic-sans-ms/Comic Sans MS Italic.ttf"
          sudo ln -sf /usr/share/fonts/opentype/comic-neue/ComicNeue-Regular.otf "/usr/share/fonts/truetype/comic-sans-ms/ComicSansMS.ttf"
          sudo fc-cache -fv
          luaotfload-tool --update --force

      # Get filename without extension
      - name: Get filename without extension
        id: get-filename
        run: |
          filename="${{ matrix.tex_file }}"
          basename="${filename%.tex}"
          echo "basename=$basename" >> $GITHUB_OUTPUT

      # Compile LaTeX document to PDF using LuaLaTeX
      - name: Compile ${{ matrix.tex_file }}
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Demo_PDFs/${{ matrix.tex_file }}
          compiler: lualatex

      # Upload compiled PDF with the same name as the tex file
      - name: Upload ${{ steps.get-filename.outputs.basename }} PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get-filename.outputs.basename }}-pdf
          path: Demo_PDFs/${{ steps.get-filename.outputs.basename }}.pdf
          retention-days: 1
          compression-level: 0



