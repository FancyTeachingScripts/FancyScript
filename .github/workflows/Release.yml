name: Compile PDFs

# This repo's OWN demo build. It calls the reusable workflow that this repo
# also publishes for the course repos, with template_dir="." because sty/ and
# tools/ live at this repo's root rather than in a submodule at template/.
#
# Publishing target is unchanged: _coll_lessonscripts/demo/ on the website,
# committed as "Update Demo PDFs from ...".
on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      website_path: demo
      commit_label: Demo
      template_dir: '.'
    secrets:
      WEBSITE_REPO_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
